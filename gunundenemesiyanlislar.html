<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Yanlışlarını Gör | Şahin Ehliyet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>
:root{--yellow:#f4c430;--yellow-strong:#c18f00;--yellow-soft:#fff4c9;--bg:#f8fafc;--surface:#fff;--surface-2:#f4f4ef;--text:#171717;--muted:#77766f;--line:#e8e6dd;--shadow:0 14px 36px rgba(28,27,20,.08)}body.dark{--bg:#11110f;--surface:#191916;--surface-2:#22221d;--text:#f7f6ef;--muted:#aaa89e;--line:#302f29;--yellow-soft:#332d16;--shadow:0 14px 38px rgba(0,0,0,.35)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text)}body{padding:0 14px 105px}.page{width:min(100%,760px);margin:auto}.top{margin:12px 0 14px;padding:18px;border-radius:24px;background:linear-gradient(135deg,var(--surface),var(--yellow-soft));border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between}.title-wrap{display:flex;align-items:center;gap:12px}.title-icon{width:44px;height:44px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;color:#27220f}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--yellow-strong);text-transform:uppercase}.title{font-size:22px;font-weight:800;margin:2px 0 0}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.summary-card{padding:15px;border-radius:19px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.summary-card i{color:var(--yellow-strong);font-size:15px}.summary-card strong{display:block;font-size:19px;margin-top:6px}.summary-card span{font-size:9px;color:var(--muted)}.toolbar{padding:13px 15px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar span{font-size:10px;color:var(--muted);line-height:1.4}.clear{border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:11px;padding:8px 10px;font-size:9px;font-weight:800}.card{margin-bottom:12px;padding:17px;border-radius:21px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.number{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--yellow-strong)}.topic{padding:5px 8px;border-radius:9px;background:var(--yellow-soft);color:var(--yellow-strong);font-size:8px;font-weight:800}.question{font-size:14px;line-height:1.6;font-weight:700;margin:10px 0 12px}.question-image{width:100%;max-width:360px;display:block;margin:10px auto 13px;border-radius:14px;border:1px solid var(--line)}.answer-grid{display:grid;gap:7px}.answer{padding:11px 12px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);font-size:9.5px;line-height:1.45}.answer-label{font-weight:800;margin-right:5px}.answer.wrong{border-color:#dc2626;background:rgba(220,38,38,.08);color:#b91c1c}.answer.correct{border-color:#16a34a;background:rgba(22,163,74,.09);color:#15803d}.answer.user{box-shadow:inset 3px 0 0 #dc2626}.detail-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.detail{padding:10px 11px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}.detail small{display:block;color:var(--muted);font-size:8px;font-weight:700}.detail b{display:block;margin-top:3px;font-size:9px}.empty{padding:55px 20px;text-align:center;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.empty-icon{width:60px;height:60px;border-radius:20px;background:var(--yellow-soft);color:var(--yellow-strong);display:grid;place-items:center;margin:0 auto 12px;font-size:22px}.empty h2{font-size:18px;margin:0 0 5px}.empty p{font-size:10px;color:var(--muted);margin:0;line-height:1.6}.bottom-nav{position:fixed!important;left:50%!important;bottom:12px!important;transform:translateX(-50%)!important;width:min(94%,520px)!important;height:72px!important;padding:7px!important;display:flex!important;align-items:center!important;justify-content:space-around!important;gap:4px!important;background:rgba(255,255,255,.96)!important;border:1px solid rgba(244,196,48,.24)!important;border-radius:24px!important;box-shadow:0 16px 38px rgba(32,27,10,.14),0 3px 10px rgba(244,196,48,.08)!important;backdrop-filter:blur(18px)!important;z-index:9999!important}.bottom-nav button{border:0!important;background:transparent!important;min-width:54px!important;height:56px!important;padding:0 8px!important;border-radius:18px!important;display:flex!important;flex:1!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:4px!important;color:#8b877b!important;font:600 10.5px/1 Poppins,system-ui,sans-serif!important}.bottom-nav button i{font-size:18px!important}.bottom-nav button span{display:block!important;white-space:nowrap!important}.bottom-nav button.active{background:linear-gradient(135deg,#ffd84d,#f4c430)!important;color:#27220f!important;box-shadow:0 8px 18px rgba(244,196,48,.28)!important}.bottom-nav .premium-btn{color:#c18f00!important}body.dark .bottom-nav{background:rgba(25,25,22,.96)!important;border-color:rgba(244,196,48,.22)!important;box-shadow:0 16px 38px rgba(0,0,0,.42)!important}body.dark .bottom-nav button{color:#aaa89e!important}body.dark .bottom-nav button:not(.active):hover{color:#f4c430!important;background:#332d16!important}body.dark .bottom-nav .premium-btn{color:#f4c430!important}@media(max-width:520px){.summary{grid-template-columns:repeat(3,1fr);gap:7px}.summary-card{padding:12px}.summary-card strong{font-size:16px}.question{font-size:13px}.detail-row{grid-template-columns:1fr}.title{font-size:19px}}
</style>
<style id="seh-darkmode-unified-fix">

<style id="seh-premium-popup-v2">

.premium-modal[style*="display: flex"],.premium-modal[style*="display:flex"],.premium-modal.open{display:flex!important;}
.premium-box-modern{position:relative!important;width:min(100%,420px)!important;padding:22px!important;border:1px solid rgba(244,196,48,.38)!important;border-radius:28px!important;background:linear-gradient(145deg,#fffdf5 0%,#fff7d6 100%)!important;color:#171717!important;box-shadow:0 30px 90px rgba(0,0,0,.38),0 10px 30px rgba(244,196,48,.12)!important;overflow:hidden!important;}

</style>
</head><body><main class="page"><header class="top"><div class="title-wrap"><div class="title-icon"><i class="fa-solid fa-circle-xmark"></i></div><div><div class="eyebrow">GÜNÜN DENEMESİ</div><div class="title">Yanlışlarını Gör</div></div></div><button class="back" onclick="history.back()" aria-label="Geri"><i class="fa-solid fa-chevron-left"></i></button></header><section class="summary"><div class="summary-card"><i class="fa-solid fa-circle-xmark"></i><strong id="wrongCount">0</strong><span>Yanlış</span></div><div class="summary-card"><i class="fa-solid fa-check"></i><strong id="correctCount">0</strong><span>Doğru cevap</span></div><div class="summary-card"><i class="fa-solid fa-chart-simple"></i><strong id="rate">0%</strong><span>Başarı</span></div></section><div class="toolbar"><span>Yanlış yaptığın soruları incele. Kırmızı alan senin işaretlediğin cevabı, yeşil alan doğru cevabı gösterir.</span><button class="clear" onclick="clearWrong()"><i class="fa-solid fa-trash-can"></i> Temizle</button></div><section id="list"></section></main><nav class="bottom-nav"><button onclick="location.href='katagoriler.html'"><i class="fa-solid fa-house"></i><span>Ana</span></button><button onclick="location.href='hesabim.html'"><i class="fa-solid fa-user"></i><span>Profil</span></button><button class="premium-btn" onclick="location.href='premium.html'"><i class="fa-solid fa-crown"></i><span>Premium</span></button><button onclick="location.href='soru.html'"><i class="fa-solid fa-circle-question"></i><span>Sor</span></button><button onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i><span>Mod</span></button></nav><script>if(localStorage.getItem('theme')==='true')document.body.classList.add('dark');function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'true':'false')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const data=JSON.parse(localStorage.getItem('wrongQuestions')||'[]');const list=document.getElementById('list');let answeredWrong=data.length;document.getElementById('wrongCount').textContent=answeredWrong;document.getElementById('correctCount').textContent=answeredWrong;document.getElementById('rate').textContent=answeredWrong?'0%':'100%';function render(){if(!data.length){list.innerHTML='<div class="empty"><div class="empty-icon"><i class="fa-solid fa-circle-check"></i></div><h2>Harika gidiyorsun</h2><p>Bu denemede yanlış yaptığın bir soru bulunmuyor. Yeni denemede de aynı başarıyı sürdür.</p></div>';return}list.innerHTML=data.map((x,i)=>{const opts=x.options||{};let answers='';Object.entries(opts).forEach(([k,v])=>{let cls='answer';if(k===x.correct)cls+=' correct';if(k===x.selected)cls+=' wrong user';answers+='<div class="'+cls+'"><span class="answer-label">'+esc(k)+'.</span>'+esc(v)+(k===x.correct?' — Doğru cevap':'')+(k===x.selected&&k!==x.correct?' — Senin cevabın':'')+'</div>'});if(!answers){answers='<div class="detail-row"><div class="detail"><small>Senin cevabın</small><b>'+esc(x.selectedText||'Bilgi eski kayıttan gelmiyor')+'</b></div><div class="detail"><small>Doğru cevap</small><b>'+esc(x.correctText||x.correct||'-')+'</b></div></div>'}return '<article class="card"><div class="card-head"><span class="number">SORU '+(i+1)+' / '+data.length+'</span><span class="topic">İNCELENECEK</span></div><div class="question">'+esc(x.question)+'</div>'+(x.image?'<img class="question-image" src="'+esc(x.image)+'" alt="Soru görseli">':'')+'<div class="answer-grid">'+answers+'</div></article>'}).join('')}function clearWrong(){if(!confirm('Yanlış soru kayıtlarını temizlemek istediğine emin misin?'))return;localStorage.removeItem('wrongQuestions');location.reload()}render();</script></body></html>
