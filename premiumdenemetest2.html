        <style>
          :root {
            --primary: #2563eb;
            --secondary: #1e3a8a;
            --bg1: #020617;
            --bg2: #0f172a;
            --card: #ffffff;
            --text: #0f172a;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #facc15;
          }

          * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
          }

          body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            background: linear-gradient(
              135deg,
              var(--secondary),
              var(--primary)
            );
            animation: bgMove 12s infinite alternate;
          }

          @keyframes bgMove {
            0% {
              background-position: 0% 50%;
            }
            100% {
              background-position: 100% 50%;
            }
          }

          /* HEADER */

          .top-bar {
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
          }

          .top-bar h2 {
            font-size: 22px;
            margin-bottom: 6px;
          }

          .top-bar a {
            display: inline-block;
            margin-top: 6px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
          }

          .top-bar a:hover {
            transform: scale(1.05);
            opacity: 0.9;
          }

          /* CONTAINER */

          .quiz-container {
            max-width: 540px;
            margin: auto;
            padding: 18px;
            animation: fadeUp 0.6s ease;
          }

          @keyframes fadeUp {
            from {
              opacity: 0;
              transform: translateY(30px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }

          /* AD */

          .ad-area {
            background: white;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
          }

          /* CARD */

          .card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: cardPop 0.4s ease;
          }

          @keyframes cardPop {
            from {
              transform: scale(0.9);
              opacity: 0;
            }
            to {
              transform: scale(1);
              opacity: 1;
            }
          }

          .card h2 {
            font-size: 17px;
            margin-bottom: 12px;
            text-align: center;
          }

          /* IMAGE */

          .question-img {
            width: 100%;
            border-radius: 14px;
            margin: 12px 0;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
          }

          /* OPTIONS */

          #options button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            background: #f1f5f9;
            cursor: pointer;
            transition: 0.25s;
          }

          #options button:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
          }

          .correct {
            background: linear-gradient(135deg, #22c55e, #16a34a) !important;
            color: white;
          }

          .wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            color: white;
          }

          /* INFO */

          #infoBox {
            display: none;
            background: #fffbeb;
            border-left: 5px solid var(--warning);
            padding: 12px;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 14px;
            animation: fadeUp 0.4s;
          }

          /* NAV */

          .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
          }

          .nav-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
              135deg,
              var(--secondary),
              var(--primary)
            );
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
          }

          .nav-buttons button:hover {
            transform: scale(1.05);
            opacity: 0.9;
          }




          /* QUIZ TOP BAR */

.quiz-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.quiz-stats {
  display: flex;
  gap: 10px;
  background: #f1f5f9;
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
}

.exit-btn {
  background: #ef4444;
  color: white;
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  transition: 0.2s;
}

.exit-btn:hover {
  transform: scale(1.1);
  opacity: 0.9;
}

/* EXIT MODAL */

.exit-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.exit-box {
  background: white;
  width: 85%;
  max-width: 320px;
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  animation: fadeUp 0.3s ease;
}

.exit-box h3 {
  margin-bottom: 8px;
}

.exit-box p {
  font-size: 14px;
  color: #475569;
  margin-bottom: 15px;
}

.exit-actions {
  display: flex;
  gap: 10px;
}

.exit-actions button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

.btn-no {
  background: #e5e7eb;
}

.btn-yes {
  background: #ef4444;
  color: white;
}

.btn-yes:hover {
  opacity: 0.9;
}


.option-img {
  width: 90px;
  max-width: 100%;
  border-radius: 8px;
  transition: 0.3s;
}

.option-img:hover {
  transform: scale(1.05);
}

        <script>

            // TIMER

let time = 45 * 60;

const timerEl = document.getElementById("timer");

const timerInterval = setInterval(() => {

  let m = Math.floor(time / 60);
  let s = time % 60;

  timerEl.textContent =
    m + ":" + (s < 10 ? "0" + s : s);

  time--;

  if (time < 0) {
    clearInterval(timerInterval);

    document.getElementById("timeModal")
    .style.display = "flex";
  }

}, 1000);

          const questionText = document.getElementById("questionText");

          const questionImg = document.getElementById("questionImg");

          function loadQuestion() {
            const q = questions[currentQuestion];
            questionText.textContent = `${currentQuestion + 1}. ${q.text}`;
            optionsDiv.innerHTML = "";
            infoBox.style.display = "none";

            if (q.image) {
              questionImg.src = q.image;
              questionImg.style.display = "block";
            } else {
              questionImg.style.display = "none";
            }

            q.options.forEach((opt, i) => {
              const btn = document.createElement("button");
              btn.textContent = opt;

              if (userAnswers[currentQuestion] !== null) {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add("correct");
                if (i === userAnswers[currentQuestion] && i !== q.correct)
                  btn.classList.add("wrong");
              }

              btn.onclick = () => selectAnswer(i, btn);
              optionsDiv.appendChild(btn);
            });
          }

          function selectAnswer(i, btn) {
            if (userAnswers[currentQuestion] !== null) return;
            userAnswers[currentQuestion] = i;
            const q = questions[currentQuestion];

            document
              .querySelectorAll("#options button")
              .forEach((b) => (b.disabled = true));

            if (i === q.correct) {
              btn.classList.add("correct");
              setTimeout(nextQuestion, 700);
            } else {
              btn.classList.add("wrong");
              document
                .querySelectorAll("#options button")
                [q.correct].classList.add("correct");
              infoBox.textContent = q.explanation;
              infoBox.style.display = "block";
            }
            updateStats();

          }

          function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
              currentQuestion++;
              loadQuestion();
            } else {
              showResult();
            }
          }
          function prevQuestion() {
            if (currentQuestion > 0) {
              currentQuestion--;
              loadQuestion();
            }
          }

  // Persist the same theme selection used by the main app.
  if(localStorage.getItem('theme')==='true') document.body.classList.add('dark');

  function injectHeader(){
    if(document.querySelector('.seh-quiz-header')) return;

    const num=(filename.match(/(\d+)\.html$/)||[])[1];
    const label=num ? `${meta[0]} ${num}` : meta[0];
    header.innerHTML=`<button class="seh-quiz-back" type="button" aria-label="Geri"><i class="fa-solid fa-arrow-left"></i></button><div class="seh-quiz-title"><span class="seh-quiz-title-icon"><i class="fa-solid ${meta[1]}"></i></span><span>${label}</span></div><button class="seh-quiz-close" type="button" aria-label="Testi kapat"><i class="fa-solid fa-xmark"></i></button>`;

  function setStatIcons(){
    const c=document.getElementById('statCorrect'),w=document.getElementById('statWrong'),e=document.getElementById('statEmpty');

  function patchStats(){
    const c=document.getElementById('statCorrect'),w=document.getElementById('statWrong'),e=document.getElementById('statEmpty');

    const cv=(c.textContent.match(/\d+/)||['0'])[0],wv=(w.textContent.match(/\d+/)||['0'])[0],ev=(e.textContent.match(/\d+/)||['0'])[0];
    c.innerHTML='<i class="fa-solid fa-check"></i><span>'+cv+'</span>';
    w.innerHTML='<i class="fa-solid fa-xmark"></i><span>'+wv+'</span>';
    e.innerHTML='<i class="fa-regular fa-circle"></i><span>'+ev+'</span>';
    c.classList.add('seh-correct-stat');w.classList.add('seh-wrong-stat');e.classList.add('seh-empty-stat');

  function patchButtons(){
    const exit=document.querySelector('.exit-btn'); if(exit) exit.innerHTML='<i class="fa-solid fa-xmark"></i>';

  }

  const originalLoad=window.loadQuestion;
  if(typeof originalLoad==='function'){
    window.loadQuestion=function(){
      originalLoad();
      patchStats(); patchButtons();
      const q=window.questions?.[window.currentQuestion];
      if(q && window.userAnswers?.[window.currentQuestion]!==null && window.userAnswers?.[window.currentQuestion]!==undefined && window.userAnswers[window.currentQuestion]!==q.correct) showLearning(q);
    };
  }

  function showLearning(q){
    const box=document.getElementById('infoBox'); if(!box) return;
    const base=(q.explanation||'').trim();
    const notes={
      Trafik:'Bu noktada temel ölçüt, kuralın hangi trafik durumunda uygulandığını doğru ayırt etmektir.',
      Motor:'Teknik sorularda parçanın görevi ile sistem içindeki etkisini birlikte düşünmek doğru seçeneği bulmayı kolaylaştırır.',
      'İlk Yardım':'İlk yardım sorularında amaç, olay yerinde güvenliği koruyarak doğru uygulamayı doğru sırayla seçmektir.',
      'Trafik Adabı':'Trafik adabı sorularında güvenli ve saygılı sürüş davranışı, yalnızca sürücünün hakkını değil diğer yol kullanıcılarının güvenliğini de gözetir.',
      'Deneme':'Soruyu çözerken anahtar kavramları ve seçeneklerdeki küçük anlam farklarını özellikle kontrol et.'
    }[meta[0].replace(' Testi','').replace(' Sınavı','')] || 'Sorunun ölçtüğü temel kuralı ve seçenekler arasındaki farkı birlikte değerlendirmek gerekir.';
    const exam={
      Trafik:'Sınav notu: '+`Bu konudan sınavda kuralın neyi ifade ettiği, hangi durumda uygulanacağı ve sürücünün hangi davranışı seçmesi gerektiği benzer bir senaryo üzerinden sorulabilir.`,
      Motor:'Sınav notu: Bu konudan sınavda parça veya sistemin görevi, çalışma prensibi, arıza belirtisi ya da doğru bakım davranışı benzer bir soru köküyle sorulabilir.',
      'İlk Yardım':'Sınav notu: Bu konudan sınavda ilk yardım uygulamasının doğru sırası, yapılması gereken veya yapılmaması gereken işlem ve olayın belirti/sonucu üzerinden soru gelebilir.',
      'Trafik Adabı':'Sınav notu: Bu konudan sınavda sürücünün doğru iletişim, sabır, empati ve güvenli davranışını ölçen günlük trafik senaryoları üzerinden soru sorulabilir.',
      'Deneme':'Sınav notu: Bu konu denemede farklı soru kökleriyle karşına çıkabilir. Özellikle kavramın tanımı, doğru uygulama ve seçenekler arasındaki ince farklara dikkat et.'
    }[meta[0].replace(' Testi','').replace(' Sınavı','')];
    box.innerHTML='<div class="seh-info-head"><i class="fa-solid fa-lightbulb"></i><span>Neden bu cevap?</span></div><div class="seh-info-body">'+escapeHtml(base)+'</div><div class="seh-info-exam"><b>'+escapeHtml(notes)+'</b><br>'+escapeHtml(exam)+'</div>';
    box.style.display='block';
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}

  const originalSelect=window.selectAnswer;
  if(typeof originalSelect==='function'){
    window.selectAnswer=function(i,btn){
      originalSelect(i,btn);
      const q=window.questions?.[window.currentQuestion];
      if(q && i!==q.correct) showLearning(q);
      patchStats(); patchButtons();
    };
  }

  const originalUpdate=window.updateStats;
  if(typeof originalUpdate==='function'){
    window.updateStats=function(){originalUpdate();patchStats();};
  }

  const originalShow=window.showResult;
  if(typeof originalShow==='function'){
    window.showResult=function(){
      originalShow();
      const card=document.querySelector('.quiz-container .card');
      if(!card) return;
      const paras=[...card.querySelectorAll('p')];
      let correct=0,wrong=0,empty=0,rate=0;
      paras.forEach(p=>{
        const t=p.textContent;
        if(t.includes('Doğru:')) correct=parseInt(t.match(/\d+/)?.[0]||0);
        if(t.includes('Yanlış:')) wrong=parseInt(t.match(/\d+/)?.[0]||0);
        if(t.includes('Boş:')) empty=parseInt(t.match(/\d+/)?.[0]||0);
        if(t.includes('Başarı Oranı:')) rate=parseInt(t.match(/\d+/)?.[0]||0);
      });
      const message=[...paras].find(p=>p.textContent.includes('Tebrikler'))?.textContent||'Testi tamamladın.';
      card.className='card quiz-result-card';
      card.innerHTML=`<div class="quiz-result-icon"><i class="fa-solid fa-flag-checkered"></i></div><h2 class="quiz-result-title">Test Sonucu</h2><p class="quiz-result-sub">Testi tamamladın. Sonuçlarını aşağıdan inceleyebilirsin.</p><div class="quiz-result-grid"><div class="quiz-result-stat correct"><i class="fa-solid fa-check"></i><b>${correct}</b><small>Doğru</small></div><div class="quiz-result-stat wrong"><i class="fa-solid fa-xmark"></i><b>${wrong}</b><small>Yanlış</small></div><div class="quiz-result-stat empty"><i class="fa-regular fa-circle"></i><b>${empty}</b><small>Boş</small></div></div><div class="quiz-result-rate">Başarı Oranı <strong>%${rate}</strong></div><p class="quiz-result-message">${escapeHtml(message.replace(/[⚪✅❌✖➡🎉]/g,''))}</p><button class="quiz-result-finish" onclick="location.href='katagoriler.html'"><i class="fa-solid fa-check"></i> Bitir</button>`;

  function initial(){

    if(typeof window.updateStats==='function') try{window.updateStats()}catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initial); else initial();
})();

(function(){
  const path=(location.pathname.split('/').pop()||'').toLowerCase();
  const isQuiz=/^(trafiktest|motortest|ilkyardimtest|trafikadabitest|deneme)\d+\.html$/.test(path)
    || /^(premiumtrafiktest|premiummotortest|premiumyardimtest|premiumadaptest|premiumdenemetest)\d+\.html$/.test(path);
  if(!isQuiz) return;
  function refreshStats(){
    const c=document.getElementById('statCorrect'),w=document.getElementById('statWrong'),e=document.getElementById('statEmpty');
    const set=(el,icon,cls)=>{if(!el)return;const m=(el.textContent.match(/\d+/)||['0'])[0];el.className=cls;el.innerHTML='<i class="'+icon+'"></i><span>'+m+'</span>';};
    set(c,'fa-solid fa-check','seh-correct-stat');
    set(w,'fa-solid fa-xmark','seh-wrong-stat');

  }
  function refreshNav(){
    const p=document.getElementById('prevBtn'),n=document.getElementById('nextBtn'),x=document.querySelector('.exit-btn');
    if(p)p.innerHTML='<i class="fa-solid fa-arrow-left"></i> Geri';
    if(n)n.innerHTML='İleri <i class="fa-solid fa-arrow-right"></i>';
    if(x)x.innerHTML='<i class="fa-solid fa-xmark"></i>';
  }
  const oldUpdate=window.updateStats;
  if(typeof oldUpdate==='function') window.updateStats=function(){oldUpdate.apply(this,arguments);refreshStats();refreshNav();};
  const oldLoad=window.loadQuestion;
  if(typeof oldLoad==='function') window.loadQuestion=function(){oldLoad.apply(this,arguments);refreshStats();refreshNav();};
  const oldSelect=window.selectAnswer;
  if(typeof oldSelect==='function') window.selectAnswer=function(){oldSelect.apply(this,arguments);refreshStats();refreshNav();};
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){refreshStats();refreshNav();});
  else {refreshStats();refreshNav();}
})();

<script>
(function(){
  const KEY='smartStudyStats';
  const normalize=s=>String(s||'').toLocaleLowerCase('tr-TR');
  function classify(text){
    const t=normalize(text);
    const scores={
      'İlk Yardım':0,
      'Motor ve Araç Tekniği':0,
      'Trafik Adabı':0,
      'Trafik ve Çevre':0
    };
    const rules={
      'İlk Yardım':['ilk yardım','kazazede','yaralı','kanama','kanaması','kırık','çıkık','burkul','yanık','zehirlen','bayıl','bilinç','solunum','kalp masaj','suni solunum','112','turnike','şok','hava yolu','koma','boğul','epilepsi'],
      'Motor ve Araç Tekniği':['motor','motor yağı','motorun','soğutma','radyatör','akü','alternatör','debriyaj','şanzıman','vites','fren sistemi','fren hidroliği','lastik','lastik basıncı','direksiyon sistemi','amortisör','süspansiyon','egzoz','yakıt','dizel','benzin','buj','krank','piston','silindir','triger','yağ filtresi','hava filtresi','antifriz','hararet','çekiş'],
      'Trafik Adabı':['trafik adabı','nezaket','saygı','empati','hoşgörü','sabır','iletişim','beden dili','sürücü davranışı','yardımcı olmak','yardım etmek','özdenetim','öfke','sakin','agresif','erdem'],
      'Trafik ve Çevre':['trafik işareti','trafik levhası','işaret','levha','kavşak','geçiş üstünlüğü','geçiş hakkı','hız sınırı','park','duraklama','sollama','şerit','otoyol','yaya geçidi','ışık','kırmızı ışık','yeşil ışık','çevre','emniyet kemeri','takip mesafesi','araçların durma','plaka','ehliyet','sürücü belgesi','alkol','sis','far','karayolu','yolcu','taşıt']
    };
    for(const [cat,words] of Object.entries(rules)) for(const w of words) if(t.includes(w)) scores[cat] += w.length>=8?2:1;
    let best='Trafik ve Çevre', max=0;
    for(const [cat,score] of Object.entries(scores)) if(score>max){best=cat;max=score;}
    return best;
  }
  function record(category, correct){
    const data=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(!data[category]) data[category]={correct:0,wrong:0,attempted:0};
    data[category].attempted++;
    if(correct) data[category].correct++; else data[category].wrong++;
    data.updatedAt=Date.now();
    localStorage.setItem(KEY,JSON.stringify(data));
  }
  window.__smartStudyRecord=record;
  window.__smartStudyClassify=classify;
  function hook(){
    if(typeof window.selectAnswer!=='function' || window.__smartStudyHooked) return;
    const original=window.selectAnswer;
    window.selectAnswer=function(i,btn){
      const questionText=(document.getElementById('questionText')||{}).textContent||'';
      original.apply(this,arguments);
      try{
        const cat=window.__SMART_STUDY_CATEGORY || classify(questionText);
        const isCorrect=!!(btn && btn.classList.contains('correct'));
        const isWrong=!!(btn && btn.classList.contains('wrong'));
        if(isCorrect || isWrong) record(cat,isCorrect);
      }catch(e){}
    };
    window.__smartStudyHooked=true;
  }
  window.__smartStudyHook=hook;
  hook();
  let tries=0; const timer=setInterval(()=>{hook(); if(++tries>30)clearInterval(timer)},250);
})();
</script>
