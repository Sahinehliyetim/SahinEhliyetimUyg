<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İnternet Yok</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050505,#111,#1a1a1a);
overflow:hidden;
color:white;
}

/* Kart */

.box{
width:92%;
max-width:390px;
padding:35px 28px;
border-radius:28px;
text-align:center;

background:linear-gradient(
135deg,
rgba(255,255,255,.04),
rgba(255,255,255,.02)
);

backdrop-filter:blur(16px);

border:1px solid rgba(250,204,21,.18);

box-shadow:
0 20px 60px rgba(0,0,0,.45),
0 0 35px rgba(250,204,21,.08);

animation:pop .5s ease;
}

@keyframes pop{
from{
opacity:0;
transform:scale(.92);
}
to{
opacity:1;
transform:scale(1);
}
}

/* icon */

.icon-wrap{
position:relative;
width:95px;
height:95px;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
margin-bottom:22px;
}

.icon-wrap::before{
content:'';
position:absolute;
inset:0;
border:4px solid rgba(255,255,255,.08);
border-top:4px solid #facc15;
border-radius:50%;
animation:spin 2.2s linear infinite;
}

.icon{
font-size:42px;
z-index:2;
color:#facc15;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* text */

h1{
font-size:24px;
font-weight:800;
color:#facc15;
margin-bottom:10px;
}

p{
font-size:14px;
line-height:1.7;
color:#d1d5db;
margin-bottom:22px;
}

/* button */

button{
width:100%;
padding:15px;
border:none;
border-radius:18px;

background:#facc15;
color:black;

font-size:15px;
font-weight:700;
cursor:pointer;

transition:.25s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(250,204,21,.25);
}

/* durum */

.status{
margin-top:16px;
font-size:13px;
color:#999;
}
</style>

<style id="seh-darkmode-unified-fix">
/* Unified Şahin Ehliyetim dark mode fixes */
html, body { background: var(--bg, #f8fafc); }
body.dark, body.dark html { background: #11110f !important; color: #f5f3e9 !important; }
body.dark .bottom-nav {
  background: rgba(25, 25, 22, .97) !important;
  border-color: rgba(244, 196, 48, .22) !important;
  box-shadow: 0 16px 38px rgba(0, 0, 0, .42) !important;
}
body.dark .bottom-nav button { color: #aaa89e !important; background: transparent !important; }
body.dark .bottom-nav button.active {
  background: linear-gradient(135deg, #ffd84d, #f4c430) !important;
  color: #27220f !important;
}
body.dark .bottom-nav .premium-btn { color: #f4c430 !important; }
body.dark .bottom-nav button:not(.active):hover { color: #f4c430 !important; background: #332d16 !important; }
body.dark .premium-modal, body.dark .premium-box-modern, body.dark .choice-card,
body.dark .modal-content, body.dark .popup, body.dark .popup-content,
body.dark .premium-popup, body.dark .ad-popup, body.dark .watch-ad-popup {
  background: #191916 !important; color: #f5f3e9 !important; border-color: #32312a !important;
}
body.dark .premium-modal *, body.dark .premium-box-modern *, body.dark .choice-card *,
body.dark .modal-content *, body.dark .popup *, body.dark .popup-content *,
body.dark .premium-popup *, body.dark .ad-popup *, body.dark .watch-ad-popup * { color: inherit; }
body.dark .premium-modal p, body.dark .premium-box-modern .desc,
body.dark .choice-card p, body.dark .popup p, body.dark .popup-content p { color: #aaa89e !important; }
</style>

<style id="seh-premium-popup-v2">
.premium-modal{position:fixed!important;inset:0!important;display:none;align-items:center!important;justify-content:center!important;padding:18px!important;background:rgba(9,9,7,.72)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;z-index:10001!important;}
.premium-modal[style*="display: flex"],.premium-modal[style*="display:flex"],.premium-modal.open{display:flex!important;}
.premium-box-modern{position:relative!important;width:min(100%,420px)!important;padding:22px!important;border:1px solid rgba(244,196,48,.38)!important;border-radius:28px!important;background:linear-gradient(145deg,#fffdf5 0%,#fff7d6 100%)!important;color:#171717!important;box-shadow:0 30px 90px rgba(0,0,0,.38),0 10px 30px rgba(244,196,48,.12)!important;overflow:hidden!important;}
.premium-box-modern:before{content:"";position:absolute;left:-70px;top:-85px;width:190px;height:190px;border-radius:50%;background:rgba(244,196,48,.18);filter:blur(3px);pointer-events:none;}
.premium-box-modern>*{position:relative;z-index:1;}
.premium-modal-head{display:flex!important;align-items:center!important;gap:13px!important;margin-bottom:18px!important;}
.premium-modal-icon{width:52px!important;height:52px!important;flex:0 0 52px!important;border-radius:17px!important;display:grid!important;place-items:center!important;background:linear-gradient(135deg,#ffd84d,#f4c430)!important;color:#27220f!important;font-size:20px!important;box-shadow:0 10px 25px rgba(244,196,48,.28)!important;}
.premium-modal-title h3,.premium-box-modern h3{margin:0!important;color:#171717!important;font-size:19px!important;font-weight:800!important;line-height:1.2!important;}
.premium-modal-title p,.premium-box-modern .desc{margin:4px 0 0!important;color:#77766f!important;font-size:10.5px!important;line-height:1.55!important;}
.choice-card{position:relative!important;display:flex!important;align-items:center!important;gap:13px!important;margin:10px 0!important;padding:15px!important;border-radius:19px!important;cursor:pointer!important;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease!important;}
.choice-card:hover{transform:translateY(-2px)!important;box-shadow:0 12px 25px rgba(28,27,20,.10)!important;}
.choice-card.ad{background:linear-gradient(135deg,#fff 0%,#f5f8ff 100%)!important;border:1px solid #d6dfed!important;}
.choice-card.premium{background:linear-gradient(135deg,#fff8d8 0%,#ffefaa 100%)!important;border:1px solid #e4b72b!important;}
.choice-icon{width:44px!important;height:44px!important;flex:0 0 44px!important;border-radius:14px!important;display:grid!important;place-items:center!important;font-size:17px!important;}
.choice-card.ad .choice-icon{background:#e8f1ff!important;color:#2563eb!important;}
.choice-card.premium .choice-icon{background:#f4c430!important;color:#27220f!important;}
.choice-copy{min-width:0!important;}
.choice-head{font-size:12.5px!important;font-weight:800!important;color:#171717!important;}
.choice-copy p,.choice-card p{margin:4px 0 0!important;font-size:9.5px!important;line-height:1.55!important;color:#77766f!important;}
.choice-arrow{margin-left:auto!important;color:#a17b00!important;font-size:12px!important;}
.cancel-btn{width:100%!important;margin-top:13px!important;padding:12px!important;border:1px solid #dedbd0!important;border-radius:15px!important;background:#f4f1e7!important;color:#55534b!important;font-size:10.5px!important;font-weight:800!important;cursor:pointer!important;}
body.dark .premium-modal{background:rgba(0,0,0,.78)!important;}
body.dark .premium-box-modern{background:linear-gradient(145deg,#191916 0%,#27261e 100%)!important;border-color:rgba(244,196,48,.34)!important;color:#f7f6ef!important;box-shadow:0 30px 90px rgba(0,0,0,.68)!important;}
body.dark .premium-box-modern:before{background:rgba(244,196,48,.10)!important;}
body.dark .premium-modal-title h3,body.dark .premium-box-modern h3,body.dark .choice-head{color:#f7f6ef!important;}
body.dark .premium-modal-title p,body.dark .premium-box-modern .desc,body.dark .choice-copy p,body.dark .choice-card p{color:#aaa89e!important;}
body.dark .choice-card.ad{background:linear-gradient(135deg,#1b2633,#18202a)!important;border-color:#344a61!important;}
body.dark .choice-card.ad .choice-icon{background:#233b55!important;color:#9fc4ff!important;}
body.dark .choice-card.premium{background:linear-gradient(135deg,#332d16,#433812)!important;border-color:#a77d08!important;}
body.dark .choice-card.premium .choice-icon{background:#f4c430!important;color:#27220f!important;}
body.dark .choice-arrow{color:#f4c430!important;}
body.dark .cancel-btn{background:#24231e!important;color:#aaa89e!important;border-color:#3b392f!important;}
</style>
</head>
<body>

<div class="box">

<div class="icon-wrap">
<div class="icon">📶</div>
</div>

<h1>İnternet Bağlantısı Yok</h1>

<p>
Devam edebilmek için internet bağlantını kontrol et.  
Bağlantı geri geldiğinde uygulama otomatik açılacaktır.
</p>

<button onclick="location.reload()">
Tekrar Dene
</button>

<div class="status" id="status">
Bağlantı bekleniyor...
</div>

</div>

<script>

/* internet geri gelirse otomatik ana sayfa */

window.addEventListener("online",()=>{
location.href="index.html";
});

/* canlı durum */

setInterval(()=>{

const status=document.getElementById("status");

if(navigator.onLine){
status.innerText="Bağlantı bulundu, yönlendiriliyor...";
location.href="index.html";
}else{
status.innerText="Bağlantı bekleniyor...";
}

},2000);

</script>

</body>
</html>
