<style>

/* ===== THEME ===== */

:root{
--bg:#f4f6fb;
--card:#fff;
--text:#000000;
--primary:#2563eb;
--shadow:0 10px 25px rgba(0,0,0,.1);
}

body.dark{
--bg:#020617;
--card:#020617;
--text:#413788;
--shadow:0 10px 25px rgba(0,0,0,.5);
}

/* ===== RESET ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,system-ui;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  transition: .3s;
padding-top: 20px;
  padding-top: env(safe-area-inset-top);


}

/* ===== HEADER ===== */

.app-header{
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;

padding:16px 18px;

display:flex;
align-items:center;
justify-content:space-between;

border-radius:0 0 25px 25px;
box-shadow:var(--shadow);
}

.app-title{
font-size:18px;
font-weight:600;
}

.back-btn{
background:none;
border:none;
color:white;
font-size:20px;
cursor:pointer;
}

/* ===== CONTAINER ===== */

.container{
padding:18px;
max-width:720px;
margin:auto;
}

/* ===== INFO BOX ===== */

.info-box{
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
padding:16px;
border-radius:20px;
text-align:center;
font-weight:600;
margin-bottom:18px;
box-shadow:0 6px 18px rgba(37,99,235,.4);

animation:float 3s infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-6px)}
}

/* ===== NEWS CARD ===== */

.news-card{
background:var(--card);
border-radius:20px;
padding:16px;
margin-bottom:16px;

box-shadow:var(--shadow);

cursor:pointer;

transition:.3s;

animation:fadeUp .5s;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(15px)}
to{opacity:1;transform:none}
}

.news-card:hover{
transform:scale(1.02);
}

.news-title{
font-size:16px;
font-weight:600;
margin-bottom:6px;
}

.news-date{
font-size:12px;
opacity:.6;
margin-bottom:6px;
}

.news-desc{
font-size:13px;
line-height:1.5;
opacity:.9;
}

/* ===== MODAL ===== */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);

display:none;
justify-content:center;
align-items:center;

z-index:999;
}

.modal.active{
display:flex;
}

.modal-box{
background:var(--card);
padding:22px;
border-radius:22px;
width:90%;
max-width:360px;

animation:pop .3s;
}

@keyframes pop{
from{transform:scale(.7);opacity:0}
to{transform:scale(1);opacity:1}
}

.modal-box h3{
margin-bottom:8px;
}

.modal-box p{
font-size:14px;
line-height:1.6;
opacity:.9;
margin-bottom:12px;
}

.modal-box button{
width:100%;
background:#2563eb;
color:white;
border:none;

padding:10px;
border-radius:14px;
font-weight:600;
cursor:pointer;
}

/* ===== EMPTY ===== */

.empty{
text-align:center;
opacity:.6;
padding:30px;
}

/* ===== MOBILE ===== */

@media(max-width:600px){

.app-title{
font-size:17px;
}

}

  display: grid;

  display: flex;

  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,.1);

}

.news-card:hover {
  transform: translateY(-3px);

}

.news-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.news-content {
  padding: 14px 18px;

.news-content h3 {
  font-size: 17px;
  font-weight: 600;

}

.news-content small {
  font-size: 12px;
  color: #64748b;

const listBox = document.getElementById("newsList");
const modal = document.getElementById("newsModal");

function renderNews(){

  listBox.innerHTML = "";

  newsData.forEach(item=>{

    const div = document.createElement("div");

    div.className = "news-card";

    div.innerHTML = `
      <img src="${item.image}" alt="${item.title}">
      <div class="news-content">
        <h3>${item.title}</h3>
        <small>${item.date}</small>
        <p>${item.summary}</p>
        <button class="read-btn" onclick="openNews(${item.id})">
          <i class="fa-solid fa-arrow-right"></i><span>Devamını Oku</span>
        </button>
      </div>
    `;

    listBox.appendChild(div);

  });

}


function openNews(id){

  const data = newsData.find(n=>n.id===id);

  document.getElementById("mTitle").textContent = data.title;
  document.getElementById("mDate").textContent = data.date;
  document.getElementById("mText").textContent = data.content;

  document.getElementById("newsModal")
    .classList.add("active");
}

function closeModal(){

  document.getElementById("newsModal")
    .classList.remove("active");
}
renderNews();

// Modal kutusu dışında tıklayınca kapanma
modal.addEventListener("click", function(e){
  if(e.target === modal){
    closeModal();
  }
});
function closeModal(){
  modal.classList.remove("active");
}

(function(){

  document.body.classList.add("dark");

/* SAĞ TIK KAPAT */

/* UZUN BASMA MENÜSÜ KAPAT */

/* KOPYALA / KES / YAPIŞTIR KISAYOLLARI KAPAT */

document.addEventListener("cut", e => e.preventDefault());
document.addEventListener("paste", e => e.preventDefault());

/* MOBİL UZUN BASMA */
document.addEventListener("touchstart", function(){}, {passive:true});

<button class="scroll-top-v5" id="scrollTopV5" aria-label="Yukarı çık"><i class="fa-solid fa-arrow-up"></i></button>
<script>
(function(){
  const btn=document.getElementById('scrollTopV5'); if(!btn) return;
  const toggle=()=>btn.classList.toggle('show',window.scrollY>280);
  window.addEventListener('scroll',toggle,{passive:true}); toggle();
  btn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
})();
</script>
