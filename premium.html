/* ================= MODERN BOTTOM NAVIGATION ================= */
body{
  padding-bottom:102px !important;
}
.bottom-nav{
  position:fixed !important;
  left:50% !important;
  bottom:12px !important;
  transform:translateX(-50%) !important;
  width:min(94%,520px) !important;
  height:72px !important;
  padding:7px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:space-around !important;
  gap:4px !important;
  background:rgba(255,255,255,.96) !important;
  border:1px solid rgba(244,196,48,.24) !important;
  border-radius:24px !important;
  box-shadow:0 16px 38px rgba(32,27,10,.14), 0 3px 10px rgba(244,196,48,.08) !important;
  backdrop-filter:blur(18px) saturate(120%) !important;
  -webkit-backdrop-filter:blur(18px) saturate(120%) !important;
  z-index:9999 !important;
}
.bottom-nav button{
  border:0 !important;
  background:transparent !important;
  min-width:54px !important;
  height:56px !important;
  padding:0 8px !important;
  border-radius:18px !important;
  display:flex !important;
  flex:1 !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  gap:4px !important;
  color:#8b877b !important;
  font:600 10.5px/1 Poppins,system-ui,sans-serif !important;
  cursor:pointer !important;
  transition:transform .22s ease, background .22s ease, color .22s ease, box-shadow .22s ease !important;
  -webkit-tap-highlight-color:transparent !important;
}
.bottom-nav button i{
  font-size:18px !important;
  line-height:1 !important;
  transition:transform .22s ease !important;
}
.bottom-nav button span{
  display:block !important;
  white-space:nowrap !important;
}
.bottom-nav button.active{
  background:linear-gradient(135deg,#ffd84d,#f4c430) !important;
  color:#27220f !important;
  box-shadow:0 8px 18px rgba(244,196,48,.28) !important;
}
.bottom-nav button.active i{
  transform:translateY(-1px) !important;
}
.bottom-nav button:not(.active):hover{
  color:#c18f00 !important;
  background:#fff9df !important;
}
.bottom-nav button:active{
  transform:scale(.94) !important;
}
.bottom-nav .premium-btn{
  color:#c18f00 !important;
}
@media(max-width:390px){
  .bottom-nav{
    width:96% !important;
    height:70px !important;
    bottom:9px !important;
  }
  .bottom-nav button{
    min-width:45px !important;
    padding:0 4px !important;
    font-size:10px !important;
  }
  .bottom-nav button i{
    font-size:17px !important;
  }
}

.premium-proof{display:flex;flex-direction:column;gap:4px;margin-top:12px;padding:11px 12px;border-radius:13px;background:var(--yellow-soft);color:var(--text)}.premium-proof i{color:#a77b00}.premium-proof strong{font-size:12px}.premium-proof span{font-size:10px;color:var(--muted)}body.dark .premium-proof{background:#332d16}.premium-proof+*{margin-top:12px}
