    <style>
      :root {
        --primary: #2563eb;
        --secondary: #1e3a8a;
        --bg1: #020617;
        --bg2: #0f172a;
        --card: #ffffff;
        --text: #0f172a;
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #facc15;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        animation: bgMove 12s infinite alternate;
      }

      @keyframes bgMove {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }

      /* HEADER */

      .top-bar {
        background: rgba(2, 6, 23, 0.9);
        backdrop-filter: blur(10px);
        padding: 15px;
        text-align: center;
        color: white;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      .top-bar h2 {
        font-size: 22px;
        margin-bottom: 6px;
      }

      .top-bar a {
        display: inline-block;
        margin-top: 6px;
        padding: 6px 12px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.3s;
      }

      .top-bar a:hover {
        transform: scale(1.05);
        opacity: 0.9;
      }

      /* CONTAINER */

      .quiz-container {
        max-width: 540px;
        margin: auto;
        padding: 18px;
        animation: fadeUp 0.6s ease;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* AD */

      .ad-area {
        background: white;
        border-radius: 14px;
        padding: 16px;
        text-align: center;
        font-weight: 600;
        margin-bottom: 15px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      }

      /* CARD */

      .card {
        background: white;
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        animation: cardPop 0.4s ease;
      }

      @keyframes cardPop {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .card h2 {
        font-size: 17px;
        margin-bottom: 12px;
        text-align: center;
      }

      /* IMAGE */

      .question-img {
        width: 100%;
        border-radius: 14px;
        margin: 12px 0;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      }

      /* OPTIONS */

      #options button {
        width: 100%;
        padding: 14px;
        margin: 8px 0;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 500;
        background: #f1f5f9;
        cursor: pointer;
        transition: 0.25s;
      }

      #options button:hover {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      .correct {
        background: linear-gradient(135deg, #22c55e, #16a34a) !important;
        color: white;
      }

      .wrong {
        background: linear-gradient(135deg, #ef4444, #dc2626) !important;
        color: white;
      }

      /* INFO */

      #infoBox {
        display: none;
        background: #fffbeb;
        border-left: 5px solid var(--warning);
        padding: 12px;
        border-radius: 12px;
        margin-top: 10px;
        font-size: 14px;
        animation: fadeUp 0.4s;
      }

      /* NAV */

      .nav-buttons {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      .nav-buttons button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
      }

      .nav-buttons button:hover {
        transform: scale(1.05);
        opacity: 0.9;
      }


                /* QUIZ TOP BAR */

.quiz-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.quiz-stats {
  display: flex;
  gap: 10px;
  background: #f1f5f9;
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
}

.exit-btn {
  background: #ef4444;
  color: white;
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  transition: 0.2s;
}

.exit-btn:hover {
  transform: scale(1.1);
  opacity: 0.9;
}

/* EXIT MODAL */

.exit-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.exit-box {
  background: white;
  width: 85%;
  max-width: 320px;
  padding: 22px;
  border-radius: 18px;
  text-align: center;
  animation: fadeUp 0.3s ease;
}

.exit-box h3 {
  margin-bottom: 8px;
}

.exit-box p {
  font-size: 14px;
  color: #475569;
  margin-bottom: 15px;
}

.exit-actions {
  display: flex;
  gap: 10px;
}

.exit-actions button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

.btn-no {
  background: #e5e7eb;
}

.btn-yes {
  background: #ef4444;
  color: white;
}

.btn-yes:hover {
  opacity: 0.9;
}

#options{display:flex!important;flex-direction:column!important;gap:9px!important}
#options button{
  width:100%!important;min-height:54px!important;margin:0!important;padding:12px 13px 12px 48px!important;position:relative!important;
  border:1px solid var(--seh-line)!important;border-radius:16px!important;background:var(--seh-surface-2)!important;color:var(--seh-text)!important;
  font-family:inherit!important;font-size:13px!important;line-height:1.45!important;font-weight:700!important;text-align:left!important;cursor:pointer!important;
  box-shadow:none!important;transition:transform .16s ease,background .18s ease,border-color .18s ease,color .18s ease!important;
}
#options button::before{content:counter(option)!important;counter-increment:option;position:absolute;left:13px;top:50%;transform:translateY(-50%);width:25px;height:25px;border-radius:9px;background:var(--seh-surface);border:1px solid var(--seh-line);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--seh-muted)}

      <!-- EXIT MODAL -->

<div id="exitModal" class="exit-modal">

  <div class="exit-box">

    <h3>Testten Çıkmak İstiyor musun?</h3>

    <p>İlerlemen kaybolabilir.</p>

    <div class="exit-actions">

      <button class="btn-no" onclick="closeExit()">Vazgeç</button>

      <button class="btn-yes" onclick="exitTest()">Evet, Çık</button>

</div>

    <div class="quiz-container">
  

      <div class="card">
         <div class="quiz-top-bar">

  <div class="quiz-stats">
    <span id="statCorrect"><i class="fa-solid fa-check"></i><span>0</span></span>
    <span id="statWrong"><i class="fa-solid fa-xmark"></i><span>0</span></span>
    <span id="statEmpty"><i class="fa-regular fa-circle"></i><span>10</span></span>
  </div>

  <button class="exit-btn" onclick="confirmExit()" aria-label="Testi kapat"><i class="fa-solid fa-xmark"></i></button>

</div>
        <h2 id="questionText"></h2>

        <img id="questionImg" class="question-img" style="display: none" />

        <div id="options"></div>

        <div id="infoBox"></div>

        <div class="nav-buttons">
          <button id="prevBtn"><i class="fa-solid fa-arrow-left"></i> Geri</button>
          <button id="nextBtn">İleri <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    </div>

    <script>
      let currentQuestion = 0;
      let userAnswers = Array(10).fill(null);

      const questions = [

      {
    text: "Bebeklerde (0-1 yaş) temel yaşam desteği uygulanırken, suni solunum ve dış kalp masajı yapma tekniği yetişkinlerden hangi yönüyle farklılık gösterir?",
    options: ["Suni solunumda bebeğin sadece ağzından üflemek yeterlidir", "Kalp masajı göğüs merkezine tek elin ayasıyla sertçe basılarak yapılır", "Ağız içi kontrol edilmeden doğrudan nefes verilir", "Suni solunum bebeklerin ağız ve burnunu birlikte içine alacak şekilde yapılır; kalp masajı ise iki parmakla uygulanır"],
    correct: 3,
    explanation: "Bebeklerin yüz yapısı küçük olduğu için ilkyardımcı ağzını bebeğin hem ağzı hem de burnunu örtecek şekilde yerleştirir. Göğüs kafesine yapılacak masaj ise zarar vermemek adına iki parmakla (işaret ve orta parmak) göğüs kemiğini 4 cm çöktürecek şekilde basılarak gerçekleştirir."
  },
  {
    text: "Kaza yerinde burun kanaması olan bir kazazedeye uygulanması gereken en doğru ilkyardım pozisyonu ve müdahalesi aşağıdakilerden hangisidir?",
    options: ["Baş geriye doğru atılarak sırtüstü yatırılır", "Hasta oturtulur, başı hafifçe öne eğilir ve burun kanatları 5 dakika süreyle sıkılır", "Başı yana çevrilerek koma pozisyonuna alınır", "Burun delikleri pamukla tamamen tıkanıp hastanın sırtı ovulur"],
    correct: 1,
    explanation: "Burun kanamalarında başı geriye atmak kanın yutağa ve mideye kaçmasına sebep olur. Doğru yöntem; hastayı oturtmak, başı hafifçe öne eğerek kanın dışarı akmasını sağlamak ve burun kanatlarını (yumuşak dokuyu) 5 dakika boyunca sıkmaktır."
  },
  {
    text: "Kulaktan kan gelmesi durumuyla karşılaşılan bilinci kapalı bir kazazedede, ilkyardımcının yapması gereken en kritik müdahale hangisidir?",
    options: ["Kanayan kulağı pamukla sıkıca tıkayıp hastayı sırtüstü yatırmak", "Kulağı temiz suyla yıkamak", "Kanayan kulak altta kalacak şekilde yan yatırmak ve kulaktan gelen sıvının rahatça akmasını sağlamak", "Hastayı hemen yürütmeye çalışmak"],
    correct: 2,
    explanation: "Kulaktan kan veya omurilik sıvısı gelmesi ciddi bir kafa tabanı kırığı belirtisidir. Kanama asla ötelenmemeli veya tıkanmamalıdır; aksi takdirde kafa içi basınç artar. Hasta, kanayan kulak yastığa/yere gelecek şekilde (altta kalacak şekilde) yan yatırılmalıdır."
  },
  {
    text: "Kaza yerinde göğsüne delici bir cisim batan (açık göğüs yaralanması olan) ve nefes almakta güçlük çeken yaralıya hangi pozisyon verilmelidir?",
    options: ["Sırtüstü yatırılarak ayakları 30 cm yukarı kaldırılır (Şok pozisyonu)", "Yüzüstü yatış pozisyonu", "Yarı oturuş veya oturuş pozisyonu", "Koma (yarı yan yatış) pozisyonu"],
    correct: 2,
    explanation: "Göğsünden yaralanan ve solunum güçlüğü çeken kazazedelerin akciğer kapasitesini en rahat kullanabileceği, nefes almasını kolaylaştıran pozisyon 'yarı oturuş' pozisyonudur."
  },
  {
    text: "İlkyardımda 'Hayat Kurtarma Zinciri' (Chain of Survival) halkalarının sıralaması hangi şıkta doğru olarak verilmiştir?",
    options: ["112'ye haber verme - Temel Yaşam Desteği - Ambulans ekiplerince müdahale - Hastane acil servisi", "Hastaneye götürme - İlaçla tedavi - 112'yi arama - Kalp masajı", "Olay yerini süpürme - Yaralıyı taşıma - Suni solunum - Ambulans çağırma", "Kalp masajı - Suni solunum - Turnike uygulama - Şok pozisyonu"],
    correct: 0,
    explanation: "Hayat kurtarma zinciri 4 halkadan oluşur: 1. Sağlık kuruluşuna bildirme (112), 2. Olay yerinde temel yaşam desteği, 3. Ambulans ekiplerinin müdahalesi, 4. Hastane acil servis müdahalesi."
  },
  {
    text: "Vücutta bir bölgenin donması (donuk yaralanması) durumunda, kaza yerinde yapılacak ilkyardımda aşağıdakilerden hangisi kesinlikle yasaktır?",
    options: ["Donan bölgeyi karla, alkolle ovalayarak veya masaj yaparak ısıtmaya çalışmak", "Isınmaya önce oda sıcaklığında başlamak", "Yaralının ıslak kıyafetlerini kuru olanlarla değiştirmek", "Yaralıya bilinci açık ise sıcak, şekerli içecekler vermek"],
    correct: 0,
    explanation: "Donmuş dokuları karla ovalamak veya sertçe masaj yapmak, buz kristallerinin hücreleri parçalamasına ve doku ölümüne (gangrene) yol açar. Donan bölge asla ovulmamalı, yavaş yavaş ve kuru ısıda (oda sıcaklığında) kendiliğinden çözülmesi sağlanmalıdır."
  },
  {
    text: "Trafik kazasında bilinci açık ancak karnından yaralanmış ve organları dışarı çıkmış (açık karın yaralanması olan) bir kazazedeye hangi pozisyon verilmelidir?",
    options: ["Yüzüstü yatırılarak başı yana çevrilir", "Sırtüstü sırtı dik olacak şekilde oturtulur", "Sırtüstü yatırılır, karın kaslarının gerilmesini önlemek için bacaklar kalçadan ve dizden bükülerek karna doğru çekilir", "Koma pozisyonuna alınır"],
    correct: 2,
    explanation: "Karın yaralanmalarında karın duvarının ve kaslarının gerilmemesi gerekir. Yaralı sırtüstü yatırılır ve dizleri bükülerek yukarı çekilir; böylece karın bölgesi gevşer, organların daha fazla dışarı çıkması ve ağrı önlenir."
  },
  {
    text: "İlkyardımcı, olay yerinde 'Bak-Dinle-Hisset' yöntemiyle kazazedenin solunumunun olmadığını anladığı an, vakit kaybetmeden ilk olarak ne yapmalıdır?",
    options: ["Hemen turnike uygulamasına başlamalıdır", "Hemen 30 kalp masajı ve ardından 2 suni solunum olacak şekilde Temel Yaşam Desteğine başlamalıdır", "Kazazedeyi yarı oturtarak su içirmelidir", "Kazazedenin elbiselerini tamamen keserek çıkarmalıdır"],
    correct: 1,
    explanation: "Solunumu durmuş bir yetişkinde zaman en büyük düşmandır. Beyin ölümü 4-6 dakika içinde başlar. Solunumun olmadığı teyit edildiği an derhal 30 kalp masajı - 2 suni solunum (30:2) döngüsü başlatılmalıdır."
  },
  {
    text: "Hava yolunun yabancı bir cisimle 'kısmi tıkanması' olan (öksürebilen, nefes alabilen ve konuşabilen) bir kişiye kaza yerinde hangi ilkyardım müdahalesi uygulanır?",
    options: ["Hemen sırtına kuvvetlice vurulur", "Heimlich manevrası uygulanarak karnı sıkıştırılır", "Dokunulmaz, sadece öksürmeye teşvik edilir", "Ağzına parmak sokularak cisim aranır"],
    correct: 2,
    explanation: "Kısmi tıkanmada kişi konuşabilir ve öksürebilir. Bu aşamada sırta vurmak veya Heimlich uygulamak cismin daha derine kaçarak tam tıkanmaya dönmesine sebep olabilir. Kişiye dokunulmamalı, sadece güçlü şekilde öksürmesi söylenmelidir."
  },
  {
    text: "Kaza yerinde güvenliği sağlamak (koruma) amacıyla, ikinci bir kazanın oluşmasını engellemek için ilkyardımcının araçların arkasına koyması gereken reflektörler şehir içi ve şehirler arası yollarda kazadan en az kaç metre uzağa yerleştirilmelidir?",
    options: ["Şehir içi 5 metre - Şehirler arası 10 metre", "Şehir içi 15 metre - Şehirler arası 30 metre", "Şehir içi 30 metre - Şehirler arası 150 metre", "Şehir içi 100 metre - Şehirler arası 500 metre"],
    correct: 2,
    explanation: "Güvenli bir fren mesafesi ve diğer sürücülerin kazayı önceden fark edebilmesi için reflektörler; şehir içi yollarda en az 30 metre, şehirler arası hızlı yollarda (otoban/ziynet yolları) ise en az 150 metre uzağa, diğer sürücülerin görebileceği şekilde yerleştirilmelidir."
  }
   
      ];

      const questionText = document.getElementById("questionText");
      const optionsDiv = document.getElementById("options");
      const infoBox = document.getElementById("infoBox");
      const questionImg = document.getElementById("questionImg");

      function loadQuestion() {
        const q = questions[currentQuestion];
        questionText.textContent = `${currentQuestion + 1}. ${q.text}`;
        optionsDiv.innerHTML = "";
        infoBox.style.display = "none";

        if (q.image) {
          questionImg.src = q.image;
          questionImg.style.display = "block";
        } else {
          questionImg.style.display = "none";
        }

        q.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.textContent = opt;

          if (userAnswers[currentQuestion] !== null) {
            btn.disabled = true;
            if (i === q.correct) btn.classList.add("correct");
            if (i === userAnswers[currentQuestion] && i !== q.correct)
              btn.classList.add("wrong");
          }

          .querySelectorAll("#options button")
          .forEach((b) => (b.disabled = true));

        if (i === q.correct) {
          btn.classList.add("correct");
          setTimeout(nextQuestion, 700);

            .querySelectorAll("#options button")

      function nextQuestion() {

          currentQuestion++;

let d = JSON.parse(localStorage.getItem("dailyTasks"));

if(d && !window.testCounted){

  if(!user.tests) user.tests = {};

/* ================= QUIZ UI ENHANCEMENT ================= */
(function(){

  function patchButtons(){
    const exit=document.querySelector('.exit-btn'); if(exit) exit.innerHTML='<i class="fa-solid fa-xmark"></i>';

  const originalLoad=window.loadQuestion;
  if(typeof originalLoad==='function'){

      Trafik:'Bu noktada temel ölçüt, kuralın hangi trafik durumunda uygulandığını doğru ayırt etmektir.',
      Motor:'Teknik sorularda parçanın görevi ile sistem içindeki etkisini birlikte düşünmek doğru seçeneği bulmayı kolaylaştırır.',
      'İlk Yardım':'İlk yardım sorularında amaç, olay yerinde güvenliği koruyarak doğru uygulamayı doğru sırayla seçmektir.',
      'Trafik Adabı':'Trafik adabı sorularında güvenli ve saygılı sürüş davranışı, yalnızca sürücünün hakkını değil diğer yol kullanıcılarının güvenliğini de gözetir.',
      'Deneme':'Soruyu çözerken anahtar kavramları ve seçeneklerdeki küçük anlam farklarını özellikle kontrol et.'
    }[meta[0].replace(' Testi','').replace(' Sınavı','')] || 'Sorunun ölçtüğü temel kuralı ve seçenekler arasındaki farkı birlikte değerlendirmek gerekir.';

      Trafik:'Sınav notu: '+`Bu konudan sınavda kuralın neyi ifade ettiği, hangi durumda uygulanacağı ve sürücünün hangi davranışı seçmesi gerektiği benzer bir senaryo üzerinden sorulabilir.`,
      Motor:'Sınav notu: Bu konudan sınavda parça veya sistemin görevi, çalışma prensibi, arıza belirtisi ya da doğru bakım davranışı benzer bir soru köküyle sorulabilir.',
      'İlk Yardım':'Sınav notu: Bu konudan sınavda ilk yardım uygulamasının doğru sırası, yapılması gereken veya yapılmaması gereken işlem ve olayın belirti/sonucu üzerinden soru gelebilir.',

      'Deneme':'Sınav notu: Bu konu denemede farklı soru kökleriyle karşına çıkabilir. Özellikle kavramın tanımı, doğru uygulama ve seçenekler arasındaki ince farklara dikkat et.'

    box.style.display='block';
  }
  function escapeHtml(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}

  const originalSelect=window.selectAnswer;
  if(typeof originalSelect==='function'){
    window.selectAnswer=function(i,btn){
      originalSelect(i,btn);
      const q=window.questions?.[window.currentQuestion];
      if(q && i!==q.correct) showLearning(q);
      patchStats(); patchButtons();
    };
  }

  const originalUpdate=window.updateStats;
  if(typeof originalUpdate==='function'){
    window.updateStats=function(){originalUpdate();patchStats();};

  const originalShow=window.showResult;
  if(typeof originalShow==='function'){
    window.showResult=function(){
      originalShow();
      const card=document.querySelector('.quiz-container .card');

      let correct=0,wrong=0,empty=0,rate=0;
      paras.forEach(p=>{
        const t=p.textContent;
        if(t.includes('Doğru:')) correct=parseInt(t.match(/\d+/)?.[0]||0);
        if(t.includes('Yanlış:')) wrong=parseInt(t.match(/\d+/)?.[0]||0);
        if(t.includes('Boş:')) empty=parseInt(t.match(/\d+/)?.[0]||0);
        if(t.includes('Başarı Oranı:')) rate=parseInt(t.match(/\d+/)?.[0]||0);

  function initial(){

  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initial); else initial();
})();

<script>
window.__SMART_STUDY_CATEGORY='İlk Yardım';
(function(){
  const KEY='smartStudyStats';
  const normalize=s=>String(s||'').toLocaleLowerCase('tr-TR');
  function classify(text){
    const t=normalize(text);
    const scores={
      'İlk Yardım':0,
      'Motor ve Araç Tekniği':0,
      'Trafik Adabı':0,
      'Trafik ve Çevre':0
    };
    const rules={
      'İlk Yardım':['ilk yardım','kazazede','yaralı','kanama','kanaması','kırık','çıkık','burkul','yanık','zehirlen','bayıl','bilinç','solunum','kalp masaj','suni solunum','112','turnike','şok','hava yolu','koma','boğul','epilepsi'],
      'Motor ve Araç Tekniği':['motor','motor yağı','motorun','soğutma','radyatör','akü','alternatör','debriyaj','şanzıman','vites','fren sistemi','fren hidroliği','lastik','lastik basıncı','direksiyon sistemi','amortisör','süspansiyon','egzoz','yakıt','dizel','benzin','buj','krank','piston','silindir','triger','yağ filtresi','hava filtresi','antifriz','hararet','çekiş'],
      'Trafik Adabı':['trafik adabı','nezaket','saygı','empati','hoşgörü','sabır','iletişim','beden dili','sürücü davranışı','yardımcı olmak','yardım etmek','özdenetim','öfke','sakin','agresif','erdem'],
      'Trafik ve Çevre':['trafik işareti','trafik levhası','işaret','levha','kavşak','geçiş üstünlüğü','geçiş hakkı','hız sınırı','park','duraklama','sollama','şerit','otoyol','yaya geçidi','ışık','kırmızı ışık','yeşil ışık','çevre','emniyet kemeri','takip mesafesi','araçların durma','plaka','ehliyet','sürücü belgesi','alkol','sis','far','karayolu','yolcu','taşıt']
    };
    for(const [cat,words] of Object.entries(rules)) for(const w of words) if(t.includes(w)) scores[cat] += w.length>=8?2:1;
    let best='Trafik ve Çevre', max=0;
    for(const [cat,score] of Object.entries(scores)) if(score>max){best=cat;max=score;}
    return best;
  }
  function record(category, correct){
    const data=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(!data[category]) data[category]={correct:0,wrong:0,attempted:0};
    data[category].attempted++;
    if(correct) data[category].correct++; else data[category].wrong++;
    data.updatedAt=Date.now();
    localStorage.setItem(KEY,JSON.stringify(data));
  }
  window.__smartStudyRecord=record;
  window.__smartStudyClassify=classify;
  function hook(){
    if(typeof window.selectAnswer!=='function' || window.__smartStudyHooked) return;
    const original=window.selectAnswer;
    window.selectAnswer=function(i,btn){
      const questionText=(document.getElementById('questionText')||{}).textContent||'';
      original.apply(this,arguments);
      try{
        const cat=window.__SMART_STUDY_CATEGORY || classify(questionText);
        const isCorrect=!!(btn && btn.classList.contains('correct'));
        const isWrong=!!(btn && btn.classList.contains('wrong'));
        if(isCorrect || isWrong) record(cat,isCorrect);
      }catch(e){}
    };
    window.__smartStudyHooked=true;
  }
  window.__smartStudyHook=hook;
  hook();
  let tries=0; const timer=setInterval(()=>{hook(); if(++tries>30)clearInterval(timer)},250);
})();
</script>
